# Publishes the web/ folder to GitHub Pages: https://renumittal.github.io/ExpenseTracking/
# One-time setup: repository Settings -> Pages -> Source: "GitHub Actions".
name: Publish web app

on:
  push:
    branches: [main]
    paths: ['web/**', '.github/workflows/pages.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      # sw.js's own CACHE version is what makes an already-open app notice a new deploy exists (it's
      # what the browser diffs to decide "there's an update, show the reload banner") -- app.js/style.css
      # changing on their own, without this, is invisible to a tab that's already loaded and just
      # navigating by hash. Stamp a version tied to this commit so every deploy is detected, without
      # anyone having to remember to bump it by hand.
      - run: sed -i "s/const CACHE = '[^']*'/const CACHE = 'expense-shell-${GITHUB_SHA::12}'/" web/sw.js
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web
      - id: deployment
        uses: actions/deploy-pages@v4
